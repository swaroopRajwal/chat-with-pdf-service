[project]
name = "chat-with-pdf-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "langchain-core>=1.5.6",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
]

[tool.poe.tasks]
db-generate = "uv run alembic revision --autogenerate"
db-migrate = "uv run alembic upgrade head"
dev = "uv run fastapi dev app/main.py"
