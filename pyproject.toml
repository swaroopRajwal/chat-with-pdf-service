[project]
name = "chat-with-pdf-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.19.1",
  "asyncpg>=0.31.0",
  "fastapi-swagger-dark>=0.0.9",
  "fastapi[standard]>=0.141.1",
  "greenlet>=3.5.5",
  "langchain-core>=1.5.6",
  "langchain-huggingface>=1.2.2",
  "langchain-text-splitters>=1.1.2",
  "litellm>=1.97.0",
  "pgvector>=0.5.0",
  "pymupdf>=1.28.2",
  "pymupdf4llm>=1.28.2",
  "python-socketio>=5.16.4",
  "sentence-transformers>=6.0.0",
  "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = ["poethepoet>=0.48.0"]

[tool.poe.tasks]
db-generate = "uv run alembic revision --autogenerate"
db-migrate = "uv run alembic upgrade head"
dev = "uv run fastapi dev app/main.py"

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
